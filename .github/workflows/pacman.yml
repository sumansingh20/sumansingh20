name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"    # Runs daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Pacman Graph
        uses: maurodesouza/pacman-contribution-graph@main
        with:
          user: sumansingh20
          color_scheme: github
          output_dir: output

      - name: Commit and Push to Output Branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add output/pacman-contribution-graph.svg || true
          git commit -m "Update Pacman Graph" || echo "No changes to commit"
          git push https://sumansingh20:${{ secrets.PAT_TOKEN }}@github.com/sumansingh20/sumansingh20.git HEAD:output
