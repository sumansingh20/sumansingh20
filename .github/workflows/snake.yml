name: Generate Snake Contribution Graph

# Run every 12 hours + allow manual runs
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Generate snake (light + dark)
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: "sumansingh20"
          outputs: |
            output/snake.svg
            output/snake-dark.svg

      # Push to output branch
      - name: Push Snake to output branch
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          git add output/snake.svg || true
          git add output/snake-dark.svg || true

          git commit -m "Update snake animation" || echo "No changes to commit"

          git push origin HEAD:output
