<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Suman Kumar — Full-Stack Developer and Security Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <rect width="1000" height="260" fill="url(#glow)"/>

  <circle cx="905" cy="60" r="150" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="955" cy="215" r="95" fill="#ffffff" fill-opacity="0.05"/>

  <text x="64" y="118" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Suman Kumar</text>
  <text x="66" y="160" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#c7d2fe">Full-Stack Developer &#183; Security Engineer</text>
  <rect x="66" y="182" width="132" height="4" rx="2" fill="url(#accent)"/>
  <text x="66" y="220" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Indian Institute of Technology, Patna &#183; Patna, India</text>
