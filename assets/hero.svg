<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Suman Kumar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#3b0764"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <g>
    <circle cx="810" cy="150" r="90" fill="url(#core)"/>
    <circle cx="810" cy="150" r="11" fill="#ede9fe">
      <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite"/>
    </circle>

    <g transform="rotate(0 810 150)">
      <ellipse cx="810" cy="150" rx="150" ry="52" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2"/>
      <circle r="7" fill="#67e8f9">
        <animateMotion dur="9s" repeatCount="indefinite" path="M660,150 a150,52 0 1,1 300,0 a150,52 0 1,1 -300,0"/>
      </circle>
    </g>
    <g transform="rotate(60 810 150)">
      <ellipse cx="810" cy="150" rx="150" ry="52" fill="none" stroke="#c4b5fd" stroke-opacity="0.5" stroke-width="2"/>
      <circle r="7" fill="#f0abfc">
        <animateMotion dur="12s" repeatCount="indefinite" path="M660,150 a150,52 0 1,1 300,0 a150,52 0 1,1 -300,0"/>
      </circle>
    </g>
    <g transform="rotate(120 810 150)">
      <ellipse cx="810" cy="150" rx="150" ry="52" fill="none" stroke="#818cf8" stroke-opacity="0.5" stroke-width="2"/>
      <circle r="7" fill="#a5b4fc">
        <animateMotion dur="15s" repeatCount="indefinite" path="M660,150 a150,52 0 1,1 300,0 a150,52 0 1,1 -300,0"/>
      </circle>
    </g>
  </g>

  <text x="64" y="140" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Suman Kumar</text>
  <text x="66" y="184" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#c7d2fe">Full-Stack Developer &#183; Security Engineer</text>
  <rect x="66" y="206" width="132" height="4" rx="2" fill="#67e8f9"/>
  <text x="66" y="244" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Indian Institute of Technology, Patna &#183; Patna, India</text>
</svg>